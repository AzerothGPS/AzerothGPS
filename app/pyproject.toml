[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azerothgps"
dynamic = ["version"]  # single source: azerothgps.__version__ (the updater compares it)
description = "Developer tools that generate data for the AzerothGPS WoW: Forever addon"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "pillow",
  "scikit-image",
  "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "lupa"]

[project.scripts]
agps = "azerothgps.cli:main"

[tool.setuptools.dynamic]
version = { attr = "azerothgps.__version__" }

[tool.setuptools.packages.find]
include = ["azerothgps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
